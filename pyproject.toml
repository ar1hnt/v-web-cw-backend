[project]
name = "backend"
version = "0.1.0"
description = "digit"
authors = [
    {name = "danil",email = "aganindanil@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standart] (>=0.116.1,<0.117.0)",
    "uvicorn (>=0.35.0,<0.36.0)",
    "pydantic-settings (>=2.10.1,<3.0.0)",
    "sqlalchemy (>=2.0.43,<3.0.0)",
    "alembic (>=1.16.5,<2.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "pydantic[email] (>=2.11.7,<3.0.0)",
    "greenlet (>=3.2.4,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest-asyncio (>=1.2.0,<2.0.0)",
]

[tool.poetry.group.dev.dependencies]
ruff = ">=0.12.12,<0.13.0"
black = ">=25.1.0,<26.0.0"
mypy = ">=1.17.1,<2.0.0"
pytest = "^8.4.2"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "C", "I", "UP", "B", "N"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = true
